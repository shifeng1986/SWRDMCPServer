# MCPServer 安全配置文件

# 是否使能高危检查（全局开关）
enabled: true

# 确认有效期（秒），高危操作确认后在此时间内无需再次确认
confirm_expire_seconds: 300

# 操作风险等级映射：将 Redfish HTTP 方法映射为风险等级
# 可选等级：low / medium / high / critical
risk_level_mapping:
  GET: low
  POST: low
  PATCH: low
  PUT: low
  DELETE: low
  # 未匹配的方法默认等级
  default: low

# 各风险等级的处理策略
# 可选策略：
#   block   - 直接拦截，抛出 SecurityCheckError
#   confirm - 需要确认，抛出 ConfirmationRequired
#   log     - 仅记录日志，允许执行
#   allow   - 直接允许，不记录日志
actions:
  critical: block
  high: log
  medium: log
  low: allow

# MCP 请求体大小限制（单位：字节）
# 当 tool 的 body 参数超过此大小时，直接拦截并记录操作日志
max_mcp_body_size: 1024

# 是否启用 MCP 请求体大小检查
mcp_body_size_check_enabled: true

# ──────────────────────────────────────────────
# 参数校验配置
# ──────────────────────────────────────────────
parameter_validation:
  # 是否启用参数校验
  enabled: true

  # 字符串参数最大长度（按参数名配置，不匹配的用 default）
  max_length:
    default: 1024
    body: 1024
    command: 1024
    actions: 2000
    pcIP: 64
    deviceIP: 64
    DeviceUser: 64
    DevicePwd: 64
    URL: 512
    sessionId: 128
    method: 16
    options: 1024

  # 敏感关键字黑名单（匹配任一即拦截）
  # 用于检测参数中是否包含编程语言代码片段
  blocked_keywords:
    # ── C/C++ ──
    - "#include"                  # 头文件引用
    - "int main("                 # 主函数入口
    - "printf("                   # C 标准输出
    - "malloc("                   # 手动内存分配
    - "->"                        # 指针成员访问

    # ── Java ──
    - "public static void main"   # Java 主函数签名
    - "System.out.println"        # Java 标准输出
    - "import java."              # Java 包导入
    - "@Override"                 # 注解

    # ── Python ──
    - "if __name__"               # 入口判断
    - "lambda "                   # 匿名函数
    - "yield "                    # 生成器

    # ── Shell ──
    - "#!/bin/"                   # Shell 脚本头

# ──────────────────────────────────────────────
# 用户认证配置
# ──────────────────────────────────────────────

# 是否启用用户认证（全局开关）
# 启用后，所有 MCP 请求必须携带有效 Token
auth:
  enabled: true
  mode: basic_only

  # 用户登录 Token 有效期（秒）
  token_expire_seconds: 3600

  # 连接级别认证缓存有效期（秒）
  cache_ttl: 3600

  # 连接级别认证缓存最大条目数
  cache_max_size: 1000

  # ──────────────────────────────────────────────
  # LDAP认证配置
  # ──────────────────────────────────────────────
  ldap:
    # 是否启用LDAP认证（优先级高于本地认证）
    enabled: true

    # LDAP服务器URI
    server_uri: "ldap://10.153.0.61:3268"

    # LDAP绑定DN（用于搜索用户）
    bind_dn: "Apprdswrdpubsyn@h3c.huawei-3com.com"

    # LDAP绑定密码
    bind_password: "Public_SWRD"

    # LDAP用户搜索基础DN
    user_search_base: "dc=h3c,dc=huawei-3com,dc=com"

    # LDAP用户搜索过滤器
    user_search_filter: "(sAMAccountName=%(user)s)"

    # ──────────────────────────────────────────────
    # LDAP部门访问控制配置
    # ──────────────────────────────────────────────
    # 是否启用基于部门的访问控制
    department_access_control:
      enabled: true

      # 允许访问的部门列表（支持多个部门）
      # 优先检查 department 字段，如果为空则检查 ou 字段
      allowed_departments:
        - "平台软件开发部"
        - "平台软件开发部BMC开发一部"
        - "平台软件开发部BMC开发二部"
        - "平台软件开发部BMC开发三部"

      # 是否使用精确匹配（false 表示模糊匹配，包含即可）
      exact_match: false
